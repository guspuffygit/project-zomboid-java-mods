[*][b]Generator - Infinite[/b] (server): an admin-placed generator that never degrades, never runs out of fuel, and makes no sound. Spawn Base.generator_infinite and place it (or brush-tool the atf_generators_01_0 tile); the server converts it into a real powered generator and keeps it topped up. It cannot be picked up, disassembled, or destroyed by normal players — a player who tries to sledgehammer it is struck dead. Admin roles with the brush tool can remove it.
[/list]

[hr][/hr]

[b][url=https://discord.gg/after-the-fall]After The Fall[/url][/b]: the #1 multiplayer server in the world

Tested and compatible with 42.20.2'''
	modVersion = '1.5.0'
