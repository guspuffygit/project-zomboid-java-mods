[h1]Included Patches[/h1]
[list]
[*][b]Talis New Music zombie scan disable[/b] (server): disables the zombie music-device subsystem on the server. Its per-player 49x49 grid scans dominated the server's Lua budget (~95% of all server Lua time). Vehicle and world radio playback is unaffected.
[*][b]True Music Radio whereAreYou fix[/b] (client): fixes a typo in TMRadio.whereAreYou that threw "attempted index: device of non-table: null" every frame when a walkie-talkie (vanilla or workshop) was transferred into a container, forcing players to ESC to stop the error spam.
[*][b]VRO legacy trunk sweep disable[/b] (server): unregisters the Vehicle Repair Overhaul fix pack's one-time trunk-capacity migration from EveryOneMinute. That migration finished long ago but kept walking every loaded vehicle and every part of each one every in-game minute, measuring 13.9% of the server main thread and stalling the tick for ~1s every 6.2s. VRO's actual post-repair capacity fix is untouched and still runs every tick.
